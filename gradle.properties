org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# composables Material Symbols 图标通过 app R.drawable 引用；AGP 默认非传递 R 会让库资源
# 进不了 app R，这里关掉（AGP 9 的 Kotlin DSL 已移除该属性，只能在 gradle.properties 设）
android.nonTransitiveRClass=false

kotlin.code.style=official

# ---- Android-on-Android 本地构建覆盖：只放在 GRADLE_USER_HOME，绝不提交 ----
# 在 arm64 Android 上打包时，AGP 自动下载的 aapt2-<ver>-linux 是 x86_64 ELF，
# execve 返回 ENOEXEC 后被 shell 当脚本解释（"syntax error: unexpected '.'"），
# AAPT2 daemon 起不来；需要指向 aarch64 的 aapt2 真身（AGP 会校验 ELF 魔数，
# 传 wrapper 脚本会被拒：「Custom AAPT2 location does not point to an AAPT2 executable」）。
#
# 因此该属性只写在 build 机的 $GRADLE_USER_HOME/gradle.properties 里：
#   android.aapt2FromMavenOverride=/data/user/0/app.dsh.mobile/files/tmp/build/aapt2
#
# 千万不要把它提交到仓库：CI runner 是 linux x86_64，没有这个路径，
# AGP 会在校验自定义 AAPT2 时直接失败，导致 test / lint / assemble 全红。
