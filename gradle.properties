org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# composables Material Symbols 图标通过 app R.drawable 引用；AGP 默认非传递 R 会让库资源
# 进不了 app R，这里关掉（AGP 9 的 Kotlin DSL 已移除该属性，只能在 gradle.properties 设）
android.nonTransitiveRClass=false

kotlin.code.style=official

# ---- Android-on-Android build override ----
# AGP 自动下载的 aapt2-<ver>-linux 是 x86_64 ELF，本机是 arm64：execve 返回 ENOEXEC
# 后被 shell 当脚本解释，报 "syntax error: unexpected '.'"，AAPT2 daemon 起不来。
# 改用 android-buildtools 扩展自带的 aarch64 aapt2 真身（AGP 会读 ELF 魔数校验，
# 传 wrapper 脚本会被拒：「Custom AAPT2 location does not point to an AAPT2 executable」）。
# 该二进制 RUNPATH 是 /data/data/com.termux/files/usr/lib，已在那儿软链扩展的 .so
# 满足 libfmt/libpng16/libexpat/libprotobuf 等依赖，因此不需要 LD_LIBRARY_PATH。
android.aapt2FromMavenOverride=/data/user/0/app.dsh.mobile/files/tmp/build/aapt2
